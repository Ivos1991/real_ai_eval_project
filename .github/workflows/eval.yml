name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Test suite to execute"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - eval
          - unit
      evidence_mode:
        description: "Allure trace evidence mode for eval tests"
        required: true
        default: "failure_only"
        type: choice
        options:
          - failure_only
          - always
          - off

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      has_allure_results: ${{ steps.detect_allure_results.outputs.has_results }}
      test_suite: ${{ steps.choose_pytest_target.outputs.test_suite }}
      allure_html_artifact_url: ${{ steps.upload_allure_html_report.outputs.artifact-url }}
    env:
      TEST_SUITE: ${{ github.event.inputs.test_suite || 'all' }}
      EVAL_TRACE_EVIDENCE_MODE: ${{ github.event.inputs.evidence_mode || vars.EVAL_TRACE_EVIDENCE_MODE || 'failure_only' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for Allure CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Type check with MyPy
        run: python -m mypy .

      - name: Choose pytest target
        id: choose_pytest_target
        shell: bash
        run: |
          case "${TEST_SUITE}" in
            eval)
              echo "target=tests/eval -m eval" >> "$GITHUB_OUTPUT"
              echo "test_suite=eval" >> "$GITHUB_OUTPUT"
              ;;
            unit)
              echo "target=tests/unit -m unit" >> "$GITHUB_OUTPUT"
              echo "test_suite=unit" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "target=tests" >> "$GITHUB_OUTPUT"
              echo "test_suite=all" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run selected tests
        run: python -m pytest ${{ steps.choose_pytest_target.outputs.target }} --alluredir=reports/allure-results --clean-alluredir

      - name: Detect Allure results
        if: always()
        id: detect_allure_results
        shell: bash
        run: |
          if [ -d reports/allure-results ] && [ "$(find reports/allure-results -type f | head -n 1)" ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Allure CLI
        if: always() && steps.detect_allure_results.outputs.has_results == 'true'
        run: npm install -g allure-commandline

      - name: Generate single-file Allure HTML report
        if: always() && steps.detect_allure_results.outputs.has_results == 'true'
        run: allure generate reports/allure-results --clean --single-file -o reports/allure-report

      - name: Upload Allure HTML report
        id: upload_allure_html_report
        if: always() && steps.detect_allure_results.outputs.has_results == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-${{ steps.choose_pytest_target.outputs.test_suite }}
          if-no-files-found: error
          path: reports/allure-report/

      - name: Upload raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-reports-${{ steps.choose_pytest_target.outputs.test_suite }}
          if-no-files-found: warn
          path: reports/

  deploy-report:
    if: always() && needs.test.outputs.has_allure_results == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download Allure HTML report
        uses: actions/download-artifact@v4
        with:
          name: allure-html-report-${{ needs.test.outputs.test_suite }}
          path: reports/allure-report

      - name: Publish report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: reports/allure-report
          force_orphan: true

      - name: Publish CI summary
        run: |
          case "${{ needs.test.result }}" in
            success) quality_gate_result="passed" ;;
            failure) quality_gate_result="failed" ;;
            cancelled) quality_gate_result="cancelled" ;;
            skipped) quality_gate_result="skipped" ;;
            *) quality_gate_result="${{ needs.test.result }}" ;;
          esac

          {
            echo "## CI Report Summary"
            echo
            echo "- Test suite: \`${{ needs.test.outputs.test_suite }}\`"
            echo "- Evidence mode: \`${{ github.event.inputs.evidence_mode || vars.EVAL_TRACE_EVIDENCE_MODE || 'failure_only' }}\`"
            echo "- CI quality gate result: \`${quality_gate_result}\`"
            echo "- Artifact report here: [here](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)"
            echo "- Artifact backup artifacts here: [here](${{ needs.test.outputs.allure_html_artifact_url }})"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-summary-artifact-only:
    if: always() && needs.test.outputs.has_allure_results == 'true' && !(github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Publish CI summary
        run: |
          case "${{ needs.test.result }}" in
            success) quality_gate_result="passed" ;;
            failure) quality_gate_result="failed" ;;
            cancelled) quality_gate_result="cancelled" ;;
            skipped) quality_gate_result="skipped" ;;
            *) quality_gate_result="${{ needs.test.result }}" ;;
          esac

          {
            echo "## CI Report Summary"
            echo
            echo "- Test suite: \`${{ needs.test.outputs.test_suite }}\`"
            echo "- Evidence mode: \`${{ github.event.inputs.evidence_mode || vars.EVAL_TRACE_EVIDENCE_MODE || 'failure_only' }}\`"
            echo "- CI quality gate result: \`${quality_gate_result}\`"
            echo "- Artifact report here: [here](${{ needs.test.outputs.allure_html_artifact_url }})"
            echo "- Artifact backup artifacts here: [here](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)"
            echo "- GitHub Pages deployment is skipped for pull request and non-master push runs."
          } >> "$GITHUB_STEP_SUMMARY"
