name: eval

on:
  push:
  pull_request:

jobs:
  lease-expiration-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run eval quality gate
        run: pytest -m eval --alluredir=reports/allure-results --clean-alluredir
        env:
          EVAL_TRACE_EVIDENCE_MODE: failure_only
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/
