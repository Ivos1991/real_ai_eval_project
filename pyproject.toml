[project]
name = "real-ai-eval-harness"
version = "0.1.0"
description = "Runnable AI evaluation harness for REAL.dev Data Field extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.13.5",
    "assertpy>=1.1",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pytest>=8.4.0",
    "python-dotenv>=1.0.1",
    "rapidfuzz>=3.9.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "config*", "core*", "eval_harness*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
